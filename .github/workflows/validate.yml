name: Validate universal skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python -m json.tool schemas/domain-rules.schema.json > /dev/null
      - run: python -m json.tool schemas/qa-domain-scenarios.schema.json > /dev/null
